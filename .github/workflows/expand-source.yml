name: Expand DESAINS source

on:
  push:
    paths:
      - ".bootstrap/READY"

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore complete project
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f .bootstrap/READY ]; then
            echo "Bootstrap marker not present; nothing to do."
            exit 0
          fi
          cat .bootstrap/part-* > /tmp/desains-project.tar.gz
          tar -xzf /tmp/desains-project.tar.gz -C .
          rm -rf .bootstrap

      - name: Commit restored source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Publish complete DESAINS website source"
          git push origin HEAD:main
